name: CI Pipeline

# Trigger on push to main, develop, or any branch
on:
  push:
    branches:
      - main
      - develop
      - feature-branch
      - 'feature/*'  # This will trigger on any feature branch
  pull_request:
    branches:
      - main
      - develop
      -	feature-branch

# Jobs that will run
jobs:
  build:
    # Run on latest Ubuntu
    runs-on: ubuntu-latest
    
    # Steps to execute
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Display a message
      - name: Build Success Message
        run: echo "Build Success - Code pushed successfully!"
      
      # Step 3: Show repository details
      - name: Show Repository Info
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
      
      # Step 4: List files (optional)
      - name: List files in repository
        run: ls -la
      
      # Step 5: Create a simple test
      - name: Simple Test
        run: |
          echo "Running tests..."
          echo "All tests passed! ✅"